<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TWT Download Portal</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
    
<div class="container">

    <div class="card">

   <div class="header">

    <a href="httpsnovation.de/en/ueber-uns/

        <img src="twt-logo.png" class="logo" alt="TWT Logo">

    </a>

    <h1>TWT Download Portal</h1>

</div>
        <p>
            Please complete your details to access the document.
        </p>

        <input
            type="text"
            id="firstname"
            placeholder="First Name">

        <input
            type="text"
            id="lastname"
            placeholder="Last Name">

        <input
            type="text"
            id="company"
            placeholder="Company">

        <input
            type="email"
            id="email"
            placeholder="Business Email">

        <button onclick="downloadPdf()">
            Download Document
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
