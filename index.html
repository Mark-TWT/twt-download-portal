<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TWT Download Portal</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
    <a href="https://twt-innovation.de/en/"
   target="_blank"
   rel="noopener noreferrer">

    <img src="twt-logo.png" class="logo" alt="TWT Logo">

</a>
    
<div class="container">

    <div class="card">
<h1 class="main-title">
    <span>TWT</span>
    <span>Science & Innovation</span>
</h1>


<h2>Download Portal</h2>

<p class="subtitle">
    Please complete your information to access the Whitepaper.
</p>


        <input
            type="text"
            id="firstname"
            placeholder="First Name *"> 

        <input
            type="text"
            id="lastname"
            placeholder="Last Name *">

        <input
            type="text"
            id="company"
            placeholder="Company *">

        <input
            type="email"
            id="email"
            placeholder="Business Email *">
        <input
    type="tel"
    id="phone"
    placeholder="Phone Number">

<textarea
    id="comments"
    placeholder="Comments"></textarea>
<div class="gdpr-container">

    <label class="gdpr-label">

        <input type="checkbox" id="gdpr">

        I agree that TWT may store my information.

    </label>

</div>

        <button onclick="downloadPdf()">
            Download Document
        </button>

    </div>

</div>

<script src="script.js?v=2"></script
</body>
</html>
